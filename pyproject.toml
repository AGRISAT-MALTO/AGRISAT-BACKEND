[project]
name = "agrisat-backend"
version = "1.0.0"
description = "AGRISAT backend API — détection et analyse de parcelles agricoles par imagerie satellite"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2",
    "httpx>=0.27,<0.28",
    "google-auth>=2.35,<3",
    "requests>=2.32,<3",  # transport requis par google.auth.transport.requests.Request (credentials.refresh)
    "numpy>=1.26,<3",
    "shapely>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
